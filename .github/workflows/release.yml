name: Release Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  AI_PROVIDER: mock
  AI_MONTHLY_BUDGET_USD: "3"
  APP_ALLOWED_ORIGINS: https://evokeink.hiteshpatwari.com,https://evoke-ink-app.hiteshpatwari.workers.dev,https://localhost,capacitor://localhost
  NEXT_TELEMETRY_DISABLED: "1"
  PRODUCTION_ORIGIN: https://evokeink.hiteshpatwari.com
  VITE_PROMPT_API_URL: https://evokeink.hiteshpatwari.com/api/prompts

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        # Keep the privileged release gate deterministic under hosted-runner
        # CPU contention; unit-level parallelism is not needed for this suite.
        run: pnpm test -- --no-file-parallelism

      - name: Build web application
        run: pnpm build

  android-package:
    name: Build signed Android release
    if: vars.ENABLE_ANDROID_RELEASE == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ vars.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed Android AAB and APK and scan bundled assets
        shell: pwsh
        run: ./scripts/Invoke-AndroidRelease.ps1

      - name: Upload signed Android release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evoke-ink-android-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30

  deploy-web:
    name: Deploy and probe Cloudflare
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AI_PROVIDER: openai
      AI_MONTHLY_BUDGET_USD: "2.70"
      AI_ESTIMATED_REQUEST_COST_USD: "0.03"
      OPENAI_TIMEOUT_MS: "45000"
      OPENAI_MAX_RETRIES: "0"
      AI_IP_MONTHLY_LIMIT: "40"
      AI_IP_HOURLY_LIMIT: "5"
      APP_ALLOWED_ORIGINS: ${{ vars.APP_ALLOWED_ORIGINS || 'https://evokeink.hiteshpatwari.com,https://evoke-ink-app.hiteshpatwari.workers.dev' }}
      HANDWRITING_TRANSCRIPTION_ALLOWED_ORIGINS: ${{ vars.HANDWRITING_TRANSCRIPTION_ALLOWED_ORIGINS || 'https://evokeink.hiteshpatwari.com,https://evoke-ink-app.hiteshpatwari.workers.dev' }}
      HANDWRITING_TRANSCRIPTION_PROVIDER: ${{ vars.HANDWRITING_TRANSCRIPTION_PROVIDER || 'mock' }}
      HANDWRITING_TRANSCRIPTION_LIVE_APPROVED: ${{ vars.HANDWRITING_TRANSCRIPTION_LIVE_APPROVED || 'false' }}
      PLAY_INTEGRITY_ENABLED: ${{ vars.PLAY_INTEGRITY_ENABLED || 'false' }}
      PLAY_INTEGRITY_PACKAGE_NAME: app.evokeink.mobile
      PLAY_INTEGRITY_CERTIFICATE_SHA256_DIGESTS: ${{ vars.PLAY_INTEGRITY_CERTIFICATE_SHA256_DIGESTS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured." >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured." >&2; exit 1; }

      - name: Build Cloudflare Worker
        run: pnpm build:vinext

      - name: Validate Cloudflare deployment bundle
        run: pnpm exec cf deploy --dry-run --prebuilt

      - name: Deploy production release
        run: pnpm exec cf deploy --prebuilt --tag production --message "Automated release $RELEASE_SHA"

      - name: Probe deployed web and prompt contracts
        shell: pwsh
        run: >-
          ./scripts/Invoke-SyntheticProbe.ps1
          -BaseUrl $env:PRODUCTION_ORIGIN
          -AllowedOrigin $env:PRODUCTION_ORIGIN
          -ExpectedProvider openai
